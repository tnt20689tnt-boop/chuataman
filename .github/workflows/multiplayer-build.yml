name: Build Chua Tam An
on:
  push:
    branches:
      - main
      - feature/supabase-multiplayer
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --no-save
      - name: Run automated tests
        run: bun run test
      - name: Build production app
        run: bun run build
